[project]
name = "sql-gym"
version = "0.1.0"
description = "A lightweight gym for practicing SQL on curated datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "itsdangerous>=2.2.0",
    "google-cloud-storage>=3.1.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.2.9",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "uvicorn>=0.49.0",
    "psycopg-pool>=3.2",
]

[project.scripts]
sql-gym = "app.main:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: browser or external-service tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/app", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["google.*", "google.cloud.*"]
ignore_missing_imports = true
